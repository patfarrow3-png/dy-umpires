<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DY Umpires">
<meta name="theme-color" content="#e8e9ea">
<title>DY Youth Baseball — Umpire Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#e8e9ea;--surface:#f2f3f4;--surface2:#ffffff;
    --green:#1a5c32;--green2:#217040;--green-bg:rgba(26,92,50,0.10);
    --black:#111111;--text:#111111;--text2:#444444;--muted:#888888;
    --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.15);
    --white:#ffffff;--blue:#1a6599;--blue-bg:rgba(26,101,153,0.10);
    --gold:#8a6d1e;--gold-bg:rgba(138,109,30,0.10);
    --radius:14px;--radius-sm:8px;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; font-size:15px; overflow-x:hidden; }

  /* HEADER */
  .header {
    position:sticky; top:0; z-index:100;
    background:rgba(232,233,234,0.97);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:2px solid var(--black);
    padding:env(safe-area-inset-top,10px) 16px 12px;
  }
  .header-top { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .logo-wrap { width:52px; height:52px; border-radius:10px; background:var(--white); border:2px solid var(--black); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:2px 2px 0px rgba(0,0,0,0.25); overflow:hidden; }
  .logo-wrap img { width:100%; height:100%; object-fit:contain; }
  .header-text { flex:1; }
  .header-title { font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:800; letter-spacing:0.3px; line-height:1.1; color:var(--black); }
  .header-title em { color:var(--green); font-style:normal; }
  .header-sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .season-tag { font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; color:var(--green); background:var(--green-bg); padding:4px 10px; border-radius:20px; border:1.5px solid var(--green); flex-shrink:0; }

  /* ADMIN BADGE */
  .admin-badge { display:none; font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; color:var(--white); background:var(--green); padding:3px 10px; border-radius:20px; border:1.5px solid var(--black); margin-left:6px; }
  .admin-badge.show { display:inline-block; }

  /* STATS */
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:var(--white); border-radius:var(--radius-sm); border:2px solid var(--black); padding:10px 8px; text-align:center; box-shadow:2px 2px 0px rgba(0,0,0,0.2); }
  .stat-num { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; line-height:1; color:var(--black); }
  .stat-num.g { color:var(--green); }
  .stat-num.b { color:var(--blue); }
  .stat-label { font-size:10px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:0.6px; }

  /* FILTERS */
  .filters { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .filters::-webkit-scrollbar { display:none; }
  .filter-btn { flex-shrink:0; font-family:'Barlow',sans-serif; font-size:12px; font-weight:600; padding:6px 13px; border-radius:20px; border:1.5px solid var(--black); background:transparent; color:var(--muted); cursor:pointer; transition:all 0.15s; }
  .filter-btn.active { background:var(--green); color:var(--white); border-color:var(--green); }

  /* SCROLL */
  .scroll-area { padding:12px 16px; padding-bottom:calc(env(safe-area-inset-bottom,16px) + 82px); }

  /* DATE GROUP */
  .date-group { margin-bottom:22px; }
  .date-label { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; padding-left:2px; }

  /* CARDS */
  .card { background:var(--white); border-radius:var(--radius); border:2px solid var(--black); margin-bottom:10px; overflow:hidden; transition:border-color 0.2s,box-shadow 0.2s; box-shadow:3px 3px 0px rgba(0,0,0,0.22); }
  .card.is-present { border-left:5px solid var(--green); }
  .card-inner { padding:12px 14px; }
  .card-venue { font-size:11px; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; gap:5px; }
  .dot { width:5px; height:5px; border-radius:50%; background:#ccc; flex-shrink:0; }
  .dot.on { background:var(--green); }
  .matchup { font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:700; color:var(--black); margin-bottom:10px; line-height:1.2; }
  .matchup .vs { font-weight:500; color:var(--muted); font-size:13px; margin:0 6px; font-family:'Barlow',sans-serif; }
  .playoff-tag { display:inline-block; font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:3px 9px; border-radius:20px; background:var(--gold-bg); color:var(--gold); border:1.5px solid var(--gold); margin-bottom:8px; }
  .umpire-row { display:flex; align-items:center; gap:8px; padding-top:10px; border-top:1.5px solid rgba(0,0,0,0.12); }
  .umpire-avatar { width:30px; height:30px; border-radius:50%; background:var(--green-bg); display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; color:var(--green); flex-shrink:0; border:1.5px solid var(--green); }
  .umpire-name { font-size:13px; font-weight:500; flex:1; color:var(--text); }
  .umpire-name.empty { color:var(--muted); font-style:italic; }
  .btns { display:flex; gap:6px; }
  .toggle { font-family:'Barlow',sans-serif; font-size:11px; font-weight:600; padding:5px 10px; border-radius:20px; border:1.5px solid var(--black); background:transparent; color:var(--muted); cursor:pointer; transition:all 0.15s; white-space:nowrap; }
  .toggle:active { transform:scale(0.95); }
  .toggle.present-on { background:var(--green-bg); color:var(--green); border-color:var(--green); }
  .toggle.paid-on { background:var(--blue-bg); color:var(--blue); border-color:var(--blue); }
  .toggle:disabled { opacity:0.4; cursor:default; }
  .toggle:disabled:active { transform:none; }

  /* READ-ONLY NOTICE */
  .readonly-bar { background:var(--green-bg); border-bottom:1.5px solid var(--green); padding:8px 16px; text-align:center; font-size:12px; color:var(--green); font-weight:600; display:none; }
  .readonly-bar.show { display:block; }

  /* EMPTY */
  .empty-state { text-align:center; padding:52px 16px; color:var(--muted); font-size:14px; }

  /* LOADING */
  .loading-bar { text-align:center; padding:40px 16px; color:var(--muted); font-size:14px; }

  /* FAB */
  .fab { position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); right:20px; width:56px; height:56px; border-radius:50%; background:var(--green); color:var(--white); border:2px solid var(--black); font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:3px 3px 0px rgba(0,0,0,0.3); z-index:200; transition:transform 0.15s; }
  .fab:active { transform:scale(0.92); }

  /* LOCK FAB */
  .lock-fab { position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 86px); right:20px; width:44px; height:44px; border-radius:50%; background:var(--white); color:var(--black); border:2px solid var(--black); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:2px 2px 0px rgba(0,0,0,0.2); z-index:200; }

  /* OVERLAY / SHEET */
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:300; backdrop-filter:blur(3px); }
  .overlay.show { display:block; }
  .sheet { position:fixed; bottom:0; left:0; right:0; z-index:400; background:var(--surface); border-radius:20px 20px 0 0; border-top:2px solid var(--black); padding:0 16px calc(env(safe-area-inset-bottom,16px) + 20px); transform:translateY(100%); transition:transform 0.3s ease; max-height:80vh; overflow-y:auto; }
  .sheet.show { transform:translateY(0); }
  .sheet-handle { width:36px; height:4px; border-radius:2px; background:var(--border2); margin:12px auto 16px; }
  .sheet-title { font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700; margin-bottom:16px; color:var(--black); }

  /* PIN MODAL */
  .pin-modal { position:fixed; inset:0; z-index:500; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); }
  .pin-modal.show { display:flex; }
  .pin-box { background:var(--white); border:2px solid var(--black); border-radius:20px; padding:28px 24px; width:300px; max-width:90vw; box-shadow:4px 4px 0px rgba(0,0,0,0.25); text-align:center; }
  .pin-box h2 { font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:800; margin-bottom:6px; }
  .pin-box p { font-size:13px; color:var(--muted); margin-bottom:20px; }
  .pin-input { width:100%; font-size:24px; font-weight:700; text-align:center; letter-spacing:8px; padding:12px; border:2px solid var(--black); border-radius:12px; font-family:'Barlow Condensed',sans-serif; outline:none; margin-bottom:12px; }
  .pin-btn { width:100%; padding:12px; background:var(--green); color:var(--white); border:2px solid var(--black); border-radius:12px; font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; cursor:pointer; box-shadow:2px 2px 0px rgba(0,0,0,0.2); }
  .pin-btn:active { transform:scale(0.98); }
  .pin-cancel { margin-top:10px; background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; font-family:'Barlow',sans-serif; }
  .pin-error { color:#c0392b; font-size:12px; margin-bottom:8px; display:none; }
  .pin-error.show { display:block; }

  /* SUMMARY SHEET */
  .ump-row { background:var(--white); border-radius:var(--radius-sm); padding:12px; margin-bottom:8px; display:flex; align-items:center; gap:12px; border:2px solid var(--black); box-shadow:2px 2px 0px rgba(0,0,0,0.18); }
  .ump-av { width:38px; height:38px; border-radius:50%; background:var(--green-bg); display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; color:var(--green); flex-shrink:0; border:1.5px solid var(--green); }
  .ump-info { flex:1; }
  .ump-name { font-weight:600; font-size:14px; color:var(--black); }
  .ump-sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .ump-badges { display:flex; gap:5px; flex-direction:column; align-items:flex-end; }
  .badge { font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; white-space:nowrap; }
  .badge.g { background:var(--green-bg); color:var(--green); border:1px solid var(--green); }
  .badge.b { background:var(--blue-bg); color:var(--blue); border:1px solid var(--blue); }
</style>
</head>
<body>

<!-- PIN MODAL -->
<div class="pin-modal" id="pinModal">
  <div class="pin-box">
    <h2>🔐 Admin Access</h2>
    <p>Enter your PIN to enable editing</p>
    <p class="pin-error" id="pinError">Incorrect PIN. Try again.</p>
    <input class="pin-input" type="password" id="pinInput" maxlength="6" placeholder="••••" inputmode="numeric">
    <button class="pin-btn" onclick="checkPin()">Unlock</button>
    <br>
    <button class="pin-cancel" onclick="closePin()">Cancel</button>
  </div>
</div>

  {id:23,date:'5/28/2026',ts:20260528,home:'Mariners',away:'Cubs',venue:'Giardino Field',umpire:'Matson Lemos'},
  {id:24,date:'TBA',ts:99999999,home:'Playoffs',away:'',venue:'',umpire:'Joseph Viamari',playoff:true},
  {id:25,date:'TBA',ts:99999999,home:'Playoffs',away:'',venue:'',umpire:'',playoff:true},
  {id:26,date:'TBA',ts:99999999,home:'Championship',away:'',venue:'',umpire:'',playoff:true},
];

let state={};
let isAdmin=false;
let filter='all';

// ── SUPABASE HELPERS ──
async function sbFetch(path, opts={}) {
  const res = await fetch(SUPABASE_URL+'/rest/v1/'+path, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer '+SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal',
      ...opts.headers
    },
    ...opts
  });
  return res;
}

async function loadState() {
  try {
    const res = await sbFetch('game_status?select=game_id,present,paid');
    const rows = await res.json();
    state = {};
    rows.forEach(r => { state['g'+r.game_id] = {present:r.present, paid:r.paid}; });
  } catch(e) { console.error('Load error',e); }
}

async function saveGame(id, present, paid) {
  try {
    await sbFetch('game_status?game_id=eq.'+id, {
      method: 'PATCH',
      body: JSON.stringify({ present, paid, updated_at: new Date().toISOString() })
    });
  } catch(e) { console.error('Save error',e); }
}

// ── PIN ──
function showPin() {
  if(isAdmin) { lockAdmin(); return; }
  document.getElementById('pinModal').classList.add('show');
  document.getElementById('pinInput').value='';
  document.getElementById('pinError').classList.remove('show');
  setTimeout(()=>document.getElementById('pinInput').focus(),100);
}
function closePin() { document.getElementById('pinModal').classList.remove('show'); }
function checkPin() {
  const val = document.getElementById('pinInput').value;
  if(val === ADMIN_PIN) {
    isAdmin = true;
    closePin();
    document.getElementById('adminBadge').classList.add('show');
    document.getElementById('readonlyBar').classList.remove('show');
    document.getElementById('lockFab').textContent = '🔓';
    render();
  } else {
    document.getElementById('pinError').classList.add('show');
    document.getElementById('pinInput').value='';
  }
}
function lockAdmin() {
  isAdmin = false;
  document.getElementById('adminBadge').classList.remove('show');
  document.getElementById('readonlyBar').classList.add('show');
  document.getElementById('lockFab').textContent = '🔒';
  render();
}
document.getElementById('pinInput').addEventListener('keydown', e => { if(e.key==='Enter') checkPin(); });

// ── TOGGLE ──
async function toggle(id, field) {
  if(!isAdmin) return;
  const s = state['g'+id] || {present:false,paid:false};
  s[field] = !s[field];
  if(field==='paid' && s.paid) s.present = true;
  state['g'+id] = s;
  stats();
  updateCard(id);
  await saveGame(id, s.present, s.paid);
}

// ── HELPERS ──
function gs(id){ return state['g'+id]||{present:false,paid:false}; }
function ini(n){ return n?n.split(' ').map(p=>p[0]).join('').toUpperCase().slice(0,2):'?'; }
function todayTs(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function setFilter(f,btn){ filter=f; document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); }

function stats(){
  let p=0,py=0;
  GAMES.forEach(g=>{ const s=gs(g.id); if(s.present)p++; if(s.paid)py++; });
  document.getElementById('s-present').textContent=p;
  document.getElementById('s-paid').textContent=py;
}

function updateCard(id){
  const c=document.getElementById('card-'+id); if(!c)return;
  const s=gs(id);
  c.className='card'+(s.present?' is-present':'');
  c.querySelector('.dot').className='dot'+(s.present?' on':'');
  const pb=c.querySelector('.btn-p'), pyb=c.querySelector('.btn-py');
  if(pb){ pb.className='toggle btn-p'+(s.present?' present-on':''); pb.textContent=s.present?'✓ Present':'Present'; pb.disabled=!isAdmin; }
  if(pyb){ pyb.className='toggle btn-py'+(s.paid?' paid-on':''); pyb.textContent=s.paid?'✓ Paid':'Paid'; pyb.disabled=!isAdmin; }
}

function fmtDate(d){
  if(d==='TBA')return'TBA';
  try{ const p=d.split('/'); const dt=new Date(+p[2],+p[0]-1,+p[1]); return dt.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric'}); }catch(e){ return d; }
}

function render(){
  const today=todayTs(), list=document.getElementById('game-list');
  const fil=GAMES.filter(g=>{
    const s=gs(g.id);
    if(filter==='present') return s.present;
    if(filter==='paid') return s.paid;
    if(filter==='unpaid') return s.present&&!s.paid;
    if(filter==='upcoming') return g.ts>=today;
    return true;
  });
  if(!fil.length){ list.innerHTML='<div class="empty-state"><div style="font-size:36px;margin-bottom:10px">⚾</div>No games match this filter.</div>'; return; }
  const grps={}; fil.forEach(g=>{ if(!grps[g.date])grps[g.date]=[]; grps[g.date].push(g); });
  list.innerHTML='';
  Object.keys(grps).forEach(dk=>{
    const div=document.createElement('div'); div.className='date-group';
    div.innerHTML='<div class="date-label">'+(dk==='TBA'?'TBA — Playoffs / Championship':fmtDate(dk))+'</div>';
    grps[dk].forEach(g=>div.appendChild(mkCard(g)));
    list.appendChild(div);
  });
}

function mkCard(g){
  const s=gs(g.id), c=document.createElement('div');
  c.className='card'+(s.present?' is-present':''); c.id='card-'+g.id;
  const um=g.umpire||'';
  const disAttr = isAdmin ? '' : 'disabled';
  c.innerHTML='<div class="card-inner"><div class="card-venue"><div class="dot'+(s.present?' on':'')+'"></div>'+(g.venue||'Venue TBD')+' · 5:30 PM</div>'
    +(g.playoff?'<div class="playoff-tag">'+g.home+'</div>':'<div class="matchup">'+g.home+'<span class="vs">vs</span>'+g.away+'</div>')
    +'<div class="umpire-row"><div class="umpire-avatar">'+ini(um)+'</div>'
    +(um?'<div class="umpire-name">'+um+'</div>':'<div class="umpire-name empty">Unassigned</div>')
    +'<div class="btns">'
    +'<button class="toggle btn-p'+(s.present?' present-on':'')+'" onclick="toggle('+g.id+',\'present\')" '+disAttr+'>'+(s.present?'✓ Present':'Present')+'</button>'
    +'<button class="toggle btn-py'+(s.paid?' paid-on':'')+'" onclick="toggle('+g.id+',\'paid\')" '+disAttr+'>'+(s.paid?'✓ Paid':'Paid')+'</button>'
    +'</div></div></div>';
  return c;
}

function openSheet(){
  const ump={};
  GAMES.forEach(g=>{
    if(!g.umpire)return;
    if(!ump[g.umpire])ump[g.umpire]={games:0,present:0,paid:0};
    ump[g.umpire].games++;
    const s=gs(g.id);
    if(s.present)ump[g.umpire].present++;
    if(s.paid)ump[g.umpire].paid++;
  });
  let html='';
  Object.keys(ump).sort().forEach(n=>{
    const u=ump[n];
    html+='<div class="ump-row"><div class="ump-av">'+ini(n)+'</div><div class="ump-info"><div class="ump-name">'+n+'</div><div class="ump-sub">'+u.games+' game'+(u.games!==1?'s':'')+' assigned</div></div><div class="ump-badges"><div class="badge g">'+u.present+'/'+u.games+' present</div><div class="badge b">'+u.paid+' paid</div></div></div>';
  });
  document.getElementById('sheet-content').innerHTML=html;
  document.getElementById('sheet').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// ── INIT ──
(async()=>{
  await loadState();
  stats();
  render();
  // Auto-refresh every 30 seconds for viewers
  setInterval(async()=>{
    await loadState();
    stats();
    render();
  }, 30000);
})();
</script>
</body>
</html>
